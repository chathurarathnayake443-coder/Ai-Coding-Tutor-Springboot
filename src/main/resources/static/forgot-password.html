<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password · AI Coding Tutor</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b0b0b;
            color: #f5f5f5;
            font-family: Arial, Helvetica, sans-serif;
        }

        .page {
            width: 100%;
            max-width: 460px;
            padding: 24px;
        }

        .card {
            background: #151515;
            border: 1px solid goldenrod;
            border-radius: 18px;
            padding: 38px;
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.08);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
            font-weight: 700;
            font-size: 18px;
        }

        .brand-mark {
            width: 42px;
            height: 42px;
            display: grid;
            place-items: center;
            border-radius: 12px;
            background: goldenrod;
            color: #151515;
            font-size: 13px;
            letter-spacing: .5px;
        }

        .eyebrow {
            margin: 0 0 8px;
            color: #9a9a9a;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: 30px;
            line-height: 1.15;
        }

        .description {
            margin: 12px 0 28px;
            color: #a7a7a7;
            font-size: 14px;
            line-height: 1.6;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 700;
        }

        input {
            width: 100%;
            height: 48px;
            border: 1px solid #3a3a3a;
            border-radius: 10px;
            padding: 0 14px;
            background: #1d1d1d;
            color: #f5f5f5;
            font-size: 15px;
            outline: none;
            transition: .2s ease;
        }

        input:focus {
            background: #151515;
            border-color: #eeeeee;
            box-shadow: 0 0 0 3px rgba(0, 0, 0, .07);
        }

        .btn {
            width: 100%;
            height: 48px;
            border: 0;
            border-radius: 10px;
            background: lightseagreen;
            color: #151515;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: .2s ease;
        }

        .btn:hover {
            background: #ffffff;
            transform: translateY(-1px);
            box-shadow: 0 8px 18px rgba(0, 0, 0, .14);
        }

        .btn:active {
            transform: translateY(0);
        }

        .back-link {
            display: block;
            margin-top: 22px;
            text-align: center;
            color: #bdbdbd;
            font-size: 13px;
            text-decoration: none;
        }

        .back-link:hover {
            color: #f5f5f5;
            text-decoration: underline;
        }

        .message {
            display: none;
            margin-top: 18px;
            padding: 12px 14px;
            border-radius: 9px;
            background: #242424;
            color: #333;
            font-size: 13px;
            line-height: 1.5;
        }

        .message.show {
            display: block;
        }

        @media (max-width: 500px) {
            .card {
                padding: 28px 22px;
            }

            h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

<div class="page">
    <div class="card">

        <div class="brand">
            <span class="brand-mark">AI</span>
            <span>AI Coding Tutor</span>
        </div>

        <p class="eyebrow">Account recovery</p>
        <h1 style="color: goldenrod">Forgot your password?</h1>

        <p class="description">
            Enter the mobile number registered with your account.
            We'll send a 6-digit OTP code to verify your identity.
        </p>

        <form id="forgot-form">
            <div class="field">
                <label for="mobile">Mobile number</label>
                <input
                        type="tel"
                        id="mobile"
                        placeholder="Enter your mobile number"
                        autocomplete="tel"
                        required
                >
            </div>

            <button type="submit" class="btn">Send OTP</button>
        </form>

        <div class="message" id="message"></div>

        <a href="login.html" class="back-link">← Back to login</a>

    </div>
</div>

<script>
    document.getElementById("forgot-form").addEventListener("submit", function (event) {
        event.preventDefault();

        const mobile = document.getElementById("mobile").value.trim();
        const message = document.getElementById("message");

        if (mobile === "") {
            message.textContent = "Please enter your mobile number.";
            message.classList.add("show");
            return;
        }

        /*
         * Connect your Spring Boot endpoint here.
         * Example:
         *
         * $.ajax({
         *     url: "http://localhost:8080/forgotPassword",
         *     type: "POST",
         *     contentType: "application/json",
         *     data: JSON.stringify({ mobile: mobile }),
         *     success: function () {
         *         window.location.href = "verify-otp.html";
         *     }
         * });
         */

        // Temporary frontend demonstration:
        sessionStorage.setItem("resetMobile", mobile);

        message.textContent =
            "A 6-digit OTP has been sent to your registered mobile number.";

        message.classList.add("show");

        setTimeout(function () {
            window.location.href = "verify-otp.html";
        }, 900);
    });
</script>

</body>
</html>
